name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: ap-southeast-1

jobs:
  lint-and-test:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find Running EC2 Instance
        id: ec2
        run: |
          INSTANCE_INFO=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=expenseflow-web-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].[InstanceId,PublicIpAddress]" \
            --output text)

          INSTANCE_ID=$(echo "$INSTANCE_INFO" | awk '{print $1}')
          EC2_IP=$(echo "$INSTANCE_INFO" | awk '{print $2}')

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "ERROR: No running EC2 instance found with tag Name=expenseflow-web-server."
            echo "Please run 'terraform apply' locally first to provision the infrastructure."
            exit 1
          fi

          echo "Deploying to EC2 instance $INSTANCE_ID ($EC2_IP)..."
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT

      - name: Deploy Containers via AWS SSM Run Command
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          echo "Waiting for SSM agent on $INSTANCE_ID to be Online..."
          for i in $(seq 1 30); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            if [ "$PING_STATUS" = "Online" ]; then
              echo "SSM agent is Online!"
              break
            fi
            sleep 5
          done

          echo "Triggering deployment of $IMAGE on $INSTANCE_ID via SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ExpenseFlow $IMAGE" \
            --parameters "commands=[\"while [ ! -f /var/lib/cloud/instance/expenseflow-bootstrap-ready ]; do echo 'Waiting for initial cloud-init setup...'; sleep 5; done\",\"echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin\",\"/usr/local/bin/deploy.sh $IMAGE\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "Waiting for SSM Command $COMMAND_ID to finish..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "--- SSM Deployment Output ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- SSM Deployment Error ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

      - name: Verify Public Health Check
        run: |
          echo "Verifying public health endpoint at http://${{ steps.ec2.outputs.ec2_ip }}/api/health..."
          curl -f --retry 5 --retry-delay 5 "http://${{ steps.ec2.outputs.ec2_ip }}/api/health"
          echo ""
          echo "Deployment verified! App URL: http://${{ steps.ec2.outputs.ec2_ip }}"
